name: Release

# Push a version tag matching the manifest (e.g. v2.5.2) to publish a release:
#   git tag v2.5.2 && git push origin v2.5.2
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches manifest version
        run: |
          python3 - <<'EOF'
          import os, sys
          sys.path.insert(0, "tools")
          import pack_check

          manifest = pack_check.load_json("manifest.json")
          version = ".".join(str(p) for p in manifest["header"]["version"])
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(
                  f"Tag {tag!r} does not match manifest version v{version}. "
                  "Bump manifest.json (header and module versions) before tagging."
              )
          print(f"Tag {tag} matches manifest version {version}.")
          EOF

      - name: Run tool self-tests
        run: python3 -m unittest discover -s tools -p "test_*.py" -v

      - name: Validate pack (strict)
        run: python3 tools/pack_check.py --strict

      - name: Build .mcpack
        run: python3 tools/build_mcpack.py --skip-check

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.mcpack > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Extract changelog section
        run: |
          python3 - <<'EOF'
          import os, re

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(
              rf"^### v{re.escape(version)}\s*$(.*?)(?=^### |\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          notes = match.group(1).strip() if match else ""
          if not notes:
              notes = f"Java 1.7 Animations v{version}. See CHANGELOG.md for history."
          with open("release_notes.md", "w", encoding="utf-8") as fh:
              fh.write(notes + "\n")
          print(notes)
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/*.mcpack \
            artifacts/SHA256SUMS.txt \
            --title "Java 1.7 Animations $GITHUB_REF_NAME" \
            --notes-file release_notes.md
